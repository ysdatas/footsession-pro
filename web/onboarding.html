<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LMFC Performance — Bienvenue</title>
  <link rel="preload" href="assets/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <style>
    .onb-card { width: 100%; max-width: 460px; }
    .onb-note { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin-bottom: 22px; }
    .onb-note strong { display: block; margin-bottom: 6px; }
    .onb-note p { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.5; margin: 0 0 12px; }
  </style>
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth">
  <div class="auth-card onb-card">
    <div class="auth-logo"><img class="brand-crest" src="assets/img/lmfc-logo.png" alt="" width="56" height="56">LMFC <span class="brand-pro">Performance</span></div>
    <div class="auth-sub">Bienvenue !</div>
    <div id="authError" class="auth-error hidden"></div>

    <div class="onb-note">
      <strong>Vous rejoignez un club ?</strong>
      <p>Demandez à l’administrateur d’enregistrer votre adresse e-mail (<span id="myEmail">—</span>) dans « Mon club → Accès ». Reconnectez-vous ensuite : votre accès s’active tout seul.</p>
      <button class="btn" type="button" id="retryBtn" style="width:100%;">J’ai été ajouté, vérifier</button>
    </div>

    <form id="createForm">
      <div class="field"><label for="c-nom">Ou créez votre club</label><input id="c-nom" required placeholder="Nom du club"></div>
      <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:14px;">Vous en serez l’administrateur et donnerez les accès par e-mail.</p>
      <button class="btn btn-primary" type="submit" style="width:100%;">Créer le club</button>
    </form>

    <div class="auth-foot"><a href="#" id="logoutLink">Déconnexion</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/onboarding-page.js"></script>
</body>
</html>
