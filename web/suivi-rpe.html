<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LMFC Performance — Suivi RPE</title>
  <link rel="preload" href="assets/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/analytics.css">
  <link rel="stylesheet" href="assets/css/rpe.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="dashboard.html" aria-label="LMFC Performance — accueil"><img class="brand-crest" src="assets/img/lmfc-logo.png" alt="" width="36" height="36"><span class="brand-name">LMFC <span class="brand-pro">Performance</span></span></a>
    <nav class="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="uAvatar">…</div>
      <div class="su-meta"><div class="su-name" id="uName">Chargement…</div><div class="su-role" id="uRole"></div></div>
      <a class="logout" href="#" id="logoutLink" title="Déconnexion" aria-label="Déconnexion"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v14h4M13 14l4-4-4-4M17 10H8"/></svg></a>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div><p class="page-kicker" aria-hidden="true">&nbsp;</p>
        <h1>Suivi RPE</h1>
        <p class="subtitle" id="srStatus" role="status" aria-live="polite">Chargement…</p>
      </div>
      <div class="page-actions">
        <div class="segmented" role="group" aria-label="Vue">
          <button type="button" data-sr-view="dash" aria-pressed="true">Tableau de bord</button>
          <button type="button" data-sr-view="grid" aria-pressed="false">Détail joueurs</button>
        </div>
        <div class="segmented" role="group" aria-label="Nombre de séances">
          <button type="button" data-sr-n="10" aria-pressed="true">10 séances</button>
          <button type="button" data-sr-n="20" aria-pressed="false">20 séances</button>
          <button type="button" data-sr-n="50" aria-pressed="false">50 séances</button>
        </div>
        <button class="btn" id="btnSrPdf" type="button">Exporter PDF</button>
      </div>
    </div>
    <div class="sr-teams" id="srTeams" role="group" aria-label="Équipe"></div>
    <p class="sr-intro">Le ressenti des joueurs après chaque séance (RPE, 1 à 10), à part du bilan du staff, équipe par équipe.</p>
    <div id="srBody" class="sr-body"></div>
  </main>

  <!-- Export PDF du Suivi RPE (rpe-pdf.js) : le choix est gardé pour la fois suivante. -->
  <div class="modal-backdrop" id="srPdfModal">
    <div class="modal modal-wide" role="dialog" aria-modal="true" aria-labelledby="srPdfTitle">
      <h2 class="as-h3" id="srPdfTitle">Exporter le suivi RPE</h2>
      <p class="text-muted modal-lead" id="srPdfLead">L’équipe et les séances affichées. Cochez le contenu du PDF.</p>
      <div class="export-block" data-select-scope>
        <div class="export-title">Contenu</div>
        <div class="select-all" role="group" aria-label="Sélection du contenu">
          <button type="button" class="btn btn-sm" data-select-all="1">Tout sélectionner</button>
          <button type="button" class="btn btn-sm" data-select-all="0">Tout désélectionner</button>
        </div>
        <div class="export-sections">
          <label class="check"><input type="checkbox" name="sr-pdf" value="summary" checked> Synthèse (moyennes, réponses, écart, charge)</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="chartRpe" checked> Graphique : RPE déclaré et RPE attendue</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="chartLoad" checked> Graphique : charge ressentie par séance</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="sessions" checked> Tableau des séances</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="players" checked> Résultats individuels (moyennes)</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="grid" checked> Détail joueur par séance</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="missing" checked> Réponses manquantes et en attente</label>
          <label class="check"><input type="checkbox" name="sr-pdf" value="method" checked> Méthode de calcul</label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" data-close="srPdfModal" type="button">Annuler</button>
        <button class="btn btn-primary" id="btnSrPdfRun" type="button">Générer le PDF</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav-mobile.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/procedure-time.js"></script>
  <script src="assets/js/rpe.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <script src="assets/js/analytics-charts.js"></script>
  <script src="assets/js/rpe-stats.js"></script>
  <script src="assets/js/suivi-rpe-dash.js"></script>
  <script src="assets/js/pdf-kit.js"></script>
  <script src="assets/js/rpe-pdf.js"></script>
  <script src="assets/js/suivi-rpe-page.js"></script>
</body>
</html>
