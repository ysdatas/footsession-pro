<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Vidéo — LMFC Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/videos.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-shell="player">
<div class="pv-wrap pv-wide">
  <div id="vvContent"><div class="empty">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/player-nav.js"></script>
<script src="assets/js/video-tracking.js"></script>
<script src="assets/js/video-status.js"></script>
<script src="assets/js/video-timeline.js"></script>
<script src="assets/js/video-ink.js"></script>
<script src="assets/js/video-annotate.js"></script>
<script src="assets/js/video-send.js"></script>
<script src="assets/js/video-workspace.js"></script>
<script>
  /* Une vidéo source et ses séquences : le poste de travail affiche
     l'une ou l'autre (?seq=…), le retour du téléphone passe de l'une
     à l'autre. */
  (async () => {
    const box = document.getElementById('vvContent');
    try {
      const player = await requirePlayer();
      if (!player) return;
      const params = new URLSearchParams(location.search);
      const { data: video, error } = await sb.from('player_videos').select('*')
        .eq('id', Number(params.get('id'))).eq('player_id', player.id).maybeSingle();
      if (error || !video) { box.innerHTML = '<div class="empty">Vidéo introuvable.</div>'; return; }
      const src = await videoUrl(video.storage_path);
      if (!src) throw new Error('Vidéo indisponible');
      document.title = `${video.titre} — LMFC Performance`;
      const { data: { session } } = await sb.auth.getSession();
      await mountVideoWorkspace(box, {
        video, src, player, mode: 'player', userId: session.user.id,
        focusSeq: Number(params.get('seq')) || null, backHref: 'mes-videos.html', history: true,
      });
      initVideoTracking({ videoId: video.id, videoElId: 'playerVideo' });
    } catch (e) {
      console.error('voir-video', e);
      box.innerHTML = `<p class="text-danger">Impossible de charger la vidéo (${escapeHtml(e.message || 'erreur inconnue')}).</p>`;
    }
  })();
</script>
</body>
</html>
