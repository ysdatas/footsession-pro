<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mes vidéos — LMFC Performance</title>
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/videos.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-shell="player">
<main class="pv-wrap pv-wide">
  <div class="pv-head">
    <div>
      <p class="page-kicker">Mon espace</p>
      <h1>Mes vidéos</h1>
      <p class="subtitle" id="pvSub">Chargement…</p>
    </div>
  </div>
  <div class="vp-tabs" id="pvTabs" role="tablist" aria-label="Mes vidéos">
    <button type="button" role="tab" aria-controls="pvContent" data-tab="videos" aria-selected="true">Vidéos <span data-count="videos"></span></button>
    <button type="button" role="tab" aria-controls="pvContent" data-tab="seqs" aria-selected="false">Mes séquences <span data-count="seqs"></span></button>
  </div>
  <div class="pv-chips hidden" id="pvChips" role="group" aria-label="Filtrer mes séquences">
    <button type="button" data-filter="all" aria-pressed="true">Toutes</button>
    <button type="button" data-filter="draft" aria-pressed="false">Brouillons</button>
    <button type="button" data-filter="sent" aria-pressed="false">Envoyées</button>
  </div>
  <div id="pvContent" role="tabpanel"><div class="empty">Chargement…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/player-nav.js"></script>
<script src="assets/js/video-status.js"></script>
<script src="assets/js/mes-videos-page.js"></script>
</body>
</html>
