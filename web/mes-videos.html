<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes vidéos — FootSession Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/videos.css">
</head>
<body>
<div class="pv-wrap">
  <div class="pv-head">
    <div>
      <h1 id="pvTitle">Mes vidéos</h1>
      <p class="subtitle" id="pvSub">Chargement…</p>
    </div>
    <nav id="playerNav"></nav>
  </div>

  <div id="pvContent"><div class="empty">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/player-nav.js"></script>
<script>
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'player-join.html'; return; }

    /* Un compte staff n'a pas de fiche joueur liée : sans ce contrôle il
       était renvoyé sur player-join.html et se voyait réclamer un code
       joueur, alors que son compte est parfaitement associé à un club. */
    const { data: profile } = await sb.from('profiles')
      .select('role, club_id').eq('id', session.user.id).maybeSingle();
    if (profile && profile.role !== 'joueur') {
      window.location.replace(profile.club_id ? 'dashboard.html' : 'onboarding.html');
      return;
    }

    const { data: player, error: pErr } = await sb.from('players').select('id, nom, prenom')
      .eq('auth_user_id', session.user.id).maybeSingle();
    if (pErr) {
      document.getElementById('pvContent').innerHTML =
        `<p class="text-danger">Lecture de ta fiche impossible : ${escapeHtml(pErr.message)}</p>`;
      return;
    }
    if (!player) { window.location.href = 'player-join.html'; return; }

    renderPlayerNav();

    const { data: videos, error } = await sb.from('player_videos')
      .select('id, titre, description, created_at')
      .eq('player_id', player.id).order('created_at', { ascending: false });

    if (error) {
      document.getElementById('pvContent').innerHTML = `<p class="text-danger">${escapeHtml(error.message)}</p>`;
      return;
    }

    document.getElementById('pvTitle').textContent = 'Mes vidéos';
    document.getElementById('pvSub').textContent =
      `Bonjour ${player.prenom || player.nom} — ${videos.length} vidéo${videos.length > 1 ? 's' : ''}`;

    if (!videos.length) {
      document.getElementById('pvContent').innerHTML = `<div class="empty">Aucune vidéo pour le moment. Ton coach ne t'a encore rien envoyé.</div>`;
      return;
    }

    document.getElementById('pvContent').innerHTML = `<div class="pv-grid">` + videos.map(v => {
      return `<a class="card pv-card" href="voir-video.html?id=${v.id}">
        <div class="pv-card-top">
          <span class="badge badge-gold">Disponible</span>
          <span class="text-muted" style="font-size:.75rem;">${escapeHtml(new Date(v.created_at).toLocaleDateString('fr-FR'))}</span>
        </div>
        <h3>${escapeHtml(v.titre)}</h3>
        ${v.description ? `<p class="text-muted" style="font-size:.85rem;">${escapeHtml(v.description)}</p>` : ''}
      </a>`;
    }).join('') + `</div>`;
  })();
</script>
</body>
</html>
