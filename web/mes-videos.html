<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes vidéos — FootSession Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/videos.css">
</head>
<body>
<div class="pv-wrap pv-wide">
  <div class="pv-head">
    <div>
      <h1>Mes vidéos</h1>
      <p class="subtitle" id="pvSub">Chargement…</p>
    </div>
    <nav id="playerNav"></nav>
  </div>

  <div id="pvContent"><div class="empty">Chargement…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/player-nav.js"></script>
<script>
  /* Vidéos brutes envoyées par le staff. Chaque vidéo s'ouvre dans le
     poste de travail : séquences, sélection, annotation, envoi. */
  (async () => {
    const box = document.getElementById('pvContent');
    try {
      const player = await requirePlayer();
      if (!player) return;
      const [{ data: videos, error }, { data: seqs }] = await Promise.all([
        sb.from('player_videos').select('id, titre, description, created_at')
          .eq('player_id', player.id).order('created_at', { ascending: false }),
        sb.from('video_sequences').select('video_id, selected, submitted_at, staff_feedback').eq('player_id', player.id),
      ]);
      if (error) throw error;
      const stats = (id) => {
        const list = (seqs || []).filter(s => s.video_id === id);
        return { n: list.length, sel: list.filter(s => s.selected).length,
          sent: list.filter(s => s.submitted_at).length, fb: list.filter(s => s.staff_feedback).length };
      };
      document.getElementById('pvSub').textContent =
        `Bonjour ${player.prenom || player.nom} — ${videos.length} vidéo${videos.length > 1 ? 's' : ''}. Ouvre une vidéo pour la découper en séquences et l’annoter.`;
      if (!videos.length) { box.innerHTML = '<div class="empty">Aucune vidéo pour le moment. Ton staff ne t’a encore rien envoyé.</div>'; return; }
      box.innerHTML = `<div class="pv-grid">${videos.map(v => {
        const s = stats(v.id);
        return `<a class="card pv-card" href="voir-video.html?id=${v.id}">
          <div class="pv-card-top">
            <span class="text-muted" style="font-size:.75rem;">${escapeHtml(new Date(v.created_at).toLocaleDateString('fr-FR'))}</span>
            ${s.fb ? '<span class="vw-flag is-ok">Retour du staff</span>' : ''}
          </div>
          <h3>${escapeHtml(v.titre)}</h3>
          ${v.description ? `<p class="text-muted" style="font-size:.85rem;">${escapeHtml(v.description)}</p>` : ''}
          <div class="pv-card-meta">${s.n
            ? `${s.n} séquence${s.n > 1 ? 's' : ''} · ${s.sel} à travailler${s.sent ? ` · ${s.sent} envoyée${s.sent > 1 ? 's' : ''}` : ''}`
            : 'Pas encore de séquence'}</div>
        </a>`;
      }).join('')}</div>`;
    } catch (e) {
      console.error('mes-videos', e);
      box.innerHTML = `<p class="text-danger">${escapeHtml(e.message)}</p>`;
    }
  })();
</script>
</body>
</html>
