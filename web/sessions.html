<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>LMFC Performance — Séances</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/session.css">
</head>
<body class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="dashboard.html" aria-label="LMFC Performance — accueil"><img class="brand-crest" src="assets/img/lmfc-logo.png" alt="" width="36" height="36"><span class="brand-name">LMFC <span class="brand-pro">Performance</span></span></a>
    <nav class="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="uAvatar">…</div>
      <div class="su-meta"><div class="su-name" id="uName">Chargement…</div><div class="su-role" id="uRole"></div></div>
      <a class="logout" href="#" id="logoutLink" title="Déconnexion" aria-label="Déconnexion"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v14h4M13 14l4-4-4-4M17 10H8"/></svg></a>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Séances du club</h1>
        <p class="subtitle" id="sessSub">Chargement…</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-primary hidden" id="btnNew" href="session-edit.html">+ Nouvelle séance</a>
      </div>
    </div>

    <div class="list-toolbar">
      <input id="searchSession" type="search" placeholder="Rechercher une séance…" aria-label="Rechercher une séance" style="max-width:320px;">
      <div class="lt-group">
        <label for="sortBy">Trier par</label>
        <select id="sortBy">
          <option value="date">Date</option>
          <option value="titre">Titre</option>
          <option value="equipe">Équipe</option>
          <option value="travail">Temps de travail</option>
        </select>
        <button class="btn btn-sm" id="sortDir" type="button">↓</button>
      </div>
      <button class="btn btn-sm" id="groupToggle" type="button">Dossiers par semaine</button>
    </div>

    <div id="listWrap"><div class="empty">Chargement…</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/procedure-time.js"></script>
  <script src="assets/js/pdf-generator.js"></script>
  <script src="assets/js/pdf-coach.js"></script>
  <script src="assets/js/sessions-list-page.js"></script>
</body>
</html>
