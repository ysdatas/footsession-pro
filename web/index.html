<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LMFC Performance — Connexion</title>
  <meta name="description" content="LMFC Performance, la plateforme du Le Mans FC : suivi individuel des joueurs, données physiques, vidéos et séances, pour le staff et les joueurs.">
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="auth">
  <main class="landing">
  <header class="landing-hero">
    <div class="landing-pitch" aria-hidden="true"></div>
    <img class="landing-crest" src="assets/img/lmfc-logo.png" alt="Blason du Le Mans FC" width="96" height="96">
    <h1 class="landing-brand"><span class="lp-line" aria-hidden="true"></span><span>LMFC <span class="brand-pro">Performance</span></span><span class="lp-line" aria-hidden="true"></span></h1>
    <p class="landing-club">Le Mans FC</p>
  </header>
  <div class="auth-card">
    <h2 class="auth-title">Connexion</h2>
    <div class="auth-sub" id="authSub">Staff et joueurs</div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authOk" class="auth-ok hidden"></div>
    <button type="button" class="btn btn-sm auth-resend hidden" id="resendBtn">Renvoyer l’e-mail de confirmation</button>

    <!-- Formulaire connexion -->
    <form id="loginForm">
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required autocomplete="email" placeholder="vous@club.fr">
      </div>
      <div class="field">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <!-- Formulaire inscription (masqué par défaut) -->
    <form id="signupForm" class="hidden">
      <div class="field">
        <label for="s-nom">Nom complet</label>
        <input type="text" id="s-nom" required placeholder="Jean Dupont">
      </div>
      <div class="field">
        <label for="s-email">Email</label>
        <input type="email" id="s-email" required placeholder="vous@club.fr">
      </div>
      <div class="field">
        <label for="s-password">Mot de passe (6+ caractères)</label>
        <input type="password" id="s-password" required minlength="6" placeholder="••••••••">
      </div>
      <p class="auth-hint">Utilisez l’adresse e-mail que votre club a enregistrée : votre accès (coach ou joueur) sera activé automatiquement.</p>
      <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>

    <div class="auth-foot">
      <a href="#" id="toggleMode">Pas encore de compte ? Créer un compte</a>
    </div>
  </div>
  <p class="landing-motto">Tous acteurs pour réussir</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/login-page.js"></script>
</body>
</html>
