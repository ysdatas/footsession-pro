<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FootSession Pro — Préventions</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/player.css">
</head>
<body class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <aside class="sidebar" id="sidebar">
    <div class="brand">Foot<span class="brand-accent">Session</span> <span class="brand-pro">Pro</span></div>
    <nav class="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="uAvatar">…</div>
      <div class="su-meta"><div class="su-name" id="uName">Chargement…</div><div class="su-role" id="uRole"></div></div>
      <a class="logout" href="#" id="logoutLink" title="Déconnexion" aria-label="Déconnexion"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v14h4M13 14l4-4-4-4M17 10H8"/></svg></a>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Préventions &amp; développement</h1>
        <p class="subtitle" id="progSub">Salle de musculation · prévention, travail individualisé, développement physique</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary hidden" id="btnAddProgram" type="button">+ Ajouter</button>
      </div>
    </div>

    <div class="players-filters">
      <select id="fPlayer" aria-label="Joueur"><option value="">Tous les joueurs</option></select>
      <select id="fCategory" aria-label="Type"><option value="">Tous les types</option></select>
      <select id="fStatus" aria-label="Statut">
        <option value="active">En cours et en pause</option>
        <option value="">Tous les statuts</option>
      </select>
    </div>

    <div id="programList"><div class="empty">Chargement…</div></div>
  </main>

  <div class="modal-backdrop" id="programModal">
    <div class="modal">
      <h3 id="programModalTitle">Nouvel élément</h3>
      <form id="programForm" class="fiche-form">
        <input type="hidden" name="program_id">
        <label>Joueur<select name="player_id" required></select></label>
        <label>Type<select name="category" required></select></label>
        <label style="grid-column:1/-1">Titre<input name="title" required placeholder="Ex. Renforcement ischio-jambiers (Nordic)" autocomplete="off"></label>
        <label style="grid-column:1/-1">Consignes / exercices<textarea name="body" rows="4" placeholder="Exercices, charges, points techniques…"></textarea></label>
        <label>Dosage<input name="dosage" placeholder="Ex. 3 × 8, 2 fois / semaine" autocomplete="off"></label>
        <label>Statut<select name="status"></select></label>
        <label>Début<input name="start_date" type="date"></label>
        <label>Fin<input name="end_date" type="date"></label>
        <label style="grid-column:1/-1">Suivi de progression<textarea name="progress_note" rows="2" placeholder="Où en est le joueur, ressenti, charges atteintes…"></textarea></label>
        <label class="check-row" style="grid-column:1/-1"><span><input type="checkbox" name="visible_to_player" checked> Visible par le joueur dans son espace</span></label>
      </form>
      <div class="modal-actions">
        <button class="btn btn-danger hidden" id="btnDeleteProgram" type="button">Supprimer</button>
        <span style="flex:1"></span>
        <button class="btn" type="button" data-close="programModal">Annuler</button>
        <button class="btn btn-primary" id="btnSaveProgram" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/perf-metrics.js"></script>
  <script src="assets/js/preventions-page.js"></script>
</body>
</html>
