<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>LMFC Performance — Vidéos joueurs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/videos.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="dashboard.html" aria-label="LMFC Performance — accueil"><img class="brand-crest" src="assets/img/lmfc-logo.png" alt="" width="36" height="36"><span class="brand-name">LMFC <span class="brand-pro">Performance</span></span></a>
    <nav class="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="uAvatar">…</div>
      <div class="su-meta"><div class="su-name" id="uName">Chargement…</div><div class="su-role" id="uRole"></div></div>
      <a class="logout" href="#" id="logoutLink" title="Déconnexion" aria-label="Déconnexion"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v14h4M13 14l4-4-4-4M17 10H8"/></svg></a>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div>
        <button class="back-inline hidden" id="vpBack" type="button">← Tous les joueurs</button>
        <h1 id="videosTitle">Vidéos joueurs</h1>
        <p class="subtitle" id="videosSub">Chargement…</p>
      </div>
      <div class="page-actions">
        <a class="btn hidden" id="videoBackLink" href="players.html">← Fiche joueur</a>
        <button class="btn btn-primary hidden" id="btnNewVideo" type="button">+ Envoyer une vidéo</button>
      </div>
    </div>

    <!-- Rempli par videos-page.js : « À voir » et joueurs, ou un joueur et ses rubriques -->
    <div id="vpView"><div class="empty">Chargement…</div></div>
  </main>

  <!-- Modale : envoi vidéo -->
  <div class="modal-backdrop" id="videoModal">
    <div class="modal">
      <h3>Envoyer une vidéo</h3>
      <div class="field">
        <label>Joueur destinataire</label>
        <select id="v-player" required><option value="">— Choisir —</option></select>
      </div>
      <div class="field"><label>Titre</label><input id="v-titre" required></div>
      <div class="field"><label>Description (optionnel)</label><textarea id="v-desc" rows="2"></textarea></div>
      <div class="field"><label>Fichier vidéo (MP4 conseillé)</label><input type="file" id="v-file" accept="video/*" required></div>
      <p class="text-muted" style="font-size:var(--fs-sm);margin:0;">Vidéo brute : le joueur et vous pourrez ensuite la découper en séquences.</p>
      <div id="v-progress" class="hidden" style="margin:10px 0;">
        <div style="height:6px;background:var(--bg-surface);border-radius:999px;overflow:hidden;">
          <div id="v-progress-bar" style="height:100%;width:30%;background:var(--gold);"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" type="button" data-close="videoModal">Annuler</button>
        <button class="btn btn-primary" id="v-submit" type="button">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Poste de travail d'une vidéo (séquences, annotations, retour) -->
  <div class="modal-backdrop" id="wsModal">
    <div class="modal modal-xl">
      <div class="ws-head"><span class="ws-who" id="wsTitle">Joueur</span><button class="btn btn-sm" type="button" data-close="wsModal">Fermer</button></div>
      <div id="wsRoot"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/video-status.js"></script>
  <script src="assets/js/video-timeline.js"></script>
  <script src="assets/js/video-ink.js"></script>
  <script src="assets/js/video-workspace.js"></script>
  <script src="assets/js/video-compile.js"></script>
  <script src="assets/js/videos-page.js"></script>
</body>
</html>
