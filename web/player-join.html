<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FootSession Pro — Espace joueur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="auth-logo">Foot<span class="g">Session</span><span class="auth-pro">JOUEUR</span></div>
    <div class="auth-sub" id="authSub">Espace joueur — mes vidéos</div>

    <div id="authError" class="auth-error hidden"></div>
    <div id="authOk" class="auth-ok hidden"></div>

    <!-- Étape 1a : connexion -->
    <form id="loginForm">
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" required autofocus placeholder="prenom.nom@email.com">
      </div>
      <div class="field">
        <label for="l-password">Mot de passe</label>
        <input type="password" id="l-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <!-- Étape 1b : inscription -->
    <form id="signupForm" class="hidden">
      <div class="field">
        <label for="s-nom">Nom complet</label>
        <input type="text" id="s-nom" required placeholder="Ton prénom et nom">
      </div>
      <div class="field">
        <label for="s-email">Email</label>
        <input type="email" id="s-email" required placeholder="prenom.nom@email.com">
      </div>
      <div class="field">
        <label for="s-password">Mot de passe (6+ caractères)</label>
        <input type="password" id="s-password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Créer mon compte</button>
    </form>

    <!-- Étape 2 : liaison au code joueur (après connexion, si pas encore lié) -->
    <form id="codeForm" class="hidden">
      <p class="text-muted" style="font-size:.85rem;margin-top:-6px;">Dernière étape : entre le code que ton coach t'a donné.</p>
      <div class="field">
        <label for="j-code">Code joueur</label>
        <input type="text" id="j-code" required placeholder="Ex: A1B2C3" style="text-transform:uppercase;">
      </div>
      <button type="submit" class="btn btn-primary">Valider</button>
    </form>

    <div class="auth-foot">
      <a href="#" id="toggleMode">Pas encore de compte ? Créer un compte</a>
    </div>
    <div class="auth-foot">
      <a href="#" id="logoutLink" class="hidden">Se déconnecter</a> ·
      <a href="index.html">Espace staff (coach/admin) →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const codeForm = document.getElementById('codeForm');
    const toggleLink = document.getElementById('toggleMode');
    const logoutLink = document.getElementById('logoutLink');
    const errBox = document.getElementById('authError');
    const okBox = document.getElementById('authOk');
    const sub = document.getElementById('authSub');
    let mode = 'login';

    function showError(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); okBox.classList.add('hidden'); }
    function showOk(msg) { okBox.textContent = msg; okBox.classList.remove('hidden'); errBox.classList.add('hidden'); }
    function clearMsgs() { errBox.classList.add('hidden'); okBox.classList.add('hidden'); }

    function showAuthForms() {
      loginForm.classList.toggle('hidden', mode !== 'login');
      signupForm.classList.toggle('hidden', mode !== 'signup');
      codeForm.classList.add('hidden');
      toggleLink.classList.remove('hidden');
      logoutLink.classList.add('hidden');
    }
    function showCodeForm() {
      loginForm.classList.add('hidden');
      signupForm.classList.add('hidden');
      codeForm.classList.remove('hidden');
      toggleLink.classList.add('hidden');
      logoutLink.classList.remove('hidden');
      sub.textContent = 'Connecté — plus qu\'une étape !';
    }

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      clearMsgs();
      mode = mode === 'login' ? 'signup' : 'login';
      showAuthForms();
      toggleLink.textContent = mode === 'login' ? 'Pas encore de compte ? Créer un compte' : 'Déjà un compte ? Se connecter';
      sub.textContent = mode === 'login' ? 'Espace joueur — mes vidéos' : 'Crée ton compte joueur';
    });

    logoutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      mode = 'login'; clearMsgs(); showAuthForms();
      toggleLink.textContent = 'Pas encore de compte ? Créer un compte';
      sub.textContent = 'Espace joueur — mes vidéos';
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsgs();
      const email = document.getElementById('l-email').value.trim();
      const password = document.getElementById('l-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return showError('Identifiants incorrects ou compte inexistant.');
      await afterAuth();
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsgs();
      const nom = document.getElementById('s-nom').value.trim();
      const email = document.getElementById('s-email').value.trim();
      const password = document.getElementById('s-password').value;
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nom } } });
      if (error) return showError(error.message || 'Inscription impossible.');
      if (data.session) { await afterAuth(); return; }
      showOk('Compte créé ! Vérifie ton email pour confirmer ton inscription, puis connecte-toi.');
    });

    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsgs();
      const code = document.getElementById('j-code').value.trim();
      const { error } = await sb.rpc('join_as_player', { p_code: code });
      if (error) return showError(error.message || 'Code invalide.');
      window.location.href = 'mes-videos.html';
    });

    // Après connexion/inscription : le joueur est-il déjà lié à une fiche ?
    async function afterAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const { data: player } = await sb.from('players').select('id').eq('auth_user_id', session.user.id).maybeSingle();
      if (player) { window.location.href = 'mes-videos.html'; return; }
      showCodeForm();
    }

    // Déjà connecté en arrivant sur la page ? on vérifie directement.
    (async () => { await afterAuth(); })();
  </script>
</body>
</html>
