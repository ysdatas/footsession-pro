<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>LMFC Performance — Corbeille</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/trash.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="app">
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="dashboard.html" aria-label="LMFC Performance — accueil"><img class="brand-crest" src="assets/img/lmfc-logo.png" alt="" width="36" height="36"><span class="brand-name">LMFC <span class="brand-pro">Performance</span></span></a>
    <nav class="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-user">
      <div class="avatar" id="uAvatar">…</div>
      <div class="su-meta"><div class="su-name" id="uName">Chargement…</div><div class="su-role" id="uRole"></div></div>
      <a class="logout" href="#" id="logoutLink" title="Déconnexion" aria-label="Déconnexion"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H4v14h4M13 14l4-4-4-4M17 10H8"/></svg></a>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Corbeille</h1>
        <p class="subtitle" id="trashSub">Éléments supprimés : restaurez-les ou supprimez-les pour de bon.</p>
      </div>
    </div>

    <div class="trash-toolbar" id="trashToolbar" hidden>
      <select id="trashType" data-remember aria-label="Type d’élément"><option value="">Tous les éléments</option></select>
      <div id="trashSelect" data-select-scope="#trashList">
        <div class="select-all" role="group" aria-label="Sélection">
          <button type="button" class="btn btn-sm" data-select-all="1">Tout sélectionner</button>
          <button type="button" class="btn btn-sm" data-select-all="0">Tout désélectionner</button>
        </div>
      </div>
      <div class="trash-bulk">
        <span class="trash-count" id="trashCount" role="status"></span>
        <button class="btn btn-sm" type="button" id="trashRestore" disabled>Restaurer</button>
        <button class="btn btn-sm btn-danger" type="button" id="trashPurge" disabled>Supprimer définitivement</button>
      </div>
    </div>

    <div class="trash-list" id="trashList"><p class="text-muted">Chargement…</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/trash-page.js"></script>
</body>
</html>
