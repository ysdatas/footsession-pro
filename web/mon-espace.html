<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mon espace — LMFC Performance</title>
  <link rel="preload" href="assets/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-shell="player">
  <main class="pv-wrap home">
    <section class="home-hero">
      <img class="home-crest" src="assets/img/lmfc-logo.png" alt="" width="72" height="72">
      <div class="home-hero-text">
        <p class="home-kicker" id="homeDate"></p>
        <h1 id="greeting">Bonjour</h1>
        <p class="subtitle" id="clubLine">Chargement…</p>
      </div>
      <div class="home-actions">
        <a class="btn btn-primary" href="mes-videos.html">Mes vidéos</a>
        <a class="btn" href="player-performance.html">Ma performance</a>
      </div>
    </section>

    <section class="home-section" aria-labelledby="homeAttnTitle">
      <h2 id="homeAttnTitle">Pour toi en ce moment</h2>
      <div class="home-attn" id="homeAttn"><div class="home-attn-card is-skel" aria-hidden="true"></div><div class="home-attn-card is-skel" aria-hidden="true"></div><div class="home-attn-card is-skel" aria-hidden="true"></div></div>
    </section>

    <section class="home-section" aria-labelledby="homeStatsTitle">
      <h2 id="homeStatsTitle">Mes derniers chiffres</h2>
      <div class="home-stats" id="homeStats"><div class="home-stat is-skel" aria-hidden="true"></div><div class="home-stat is-skel" aria-hidden="true"></div><div class="home-stat is-skel" aria-hidden="true"></div><div class="home-stat is-skel" aria-hidden="true"></div></div>
    </section>

    <!-- Sous les chiffres : elle n'apparaît qu'après la réponse du navigateur, sans pousser le haut de page (CLS). -->
    <section class="home-section" id="pushBox" aria-label="Notifications" hidden></section>

    <section class="home-section" aria-labelledby="homeTilesTitle">
      <h2 id="homeTilesTitle">Mon espace</h2>
      <div class="home-tiles" id="homeTiles"></div>
    </section>

    <section class="home-section" id="compte" aria-labelledby="homeAccountTitle">
      <h2 id="homeAccountTitle">Mon compte</h2>
      <div class="home-account">
        <form class="card" id="emailForm">
          <h3>Adresse e-mail</h3>
          <p class="field-hint" id="emailNow"></p>
          <div class="field"><label for="newEmail">Nouvelle adresse</label><input id="newEmail" type="email" required autocomplete="email" placeholder="toi@exemple.fr"></div>
          <button class="btn btn-primary btn-sm" type="submit">Changer l’e-mail</button>
        </form>
        <form class="card" id="passForm">
          <h3>Mot de passe</h3>
          <div class="field"><label for="newPass">Nouveau mot de passe (6 caractères minimum)</label><input id="newPass" type="password" required minlength="6" autocomplete="new-password"></div>
          <div class="field"><label for="newPass2">Confirmer</label><input id="newPass2" type="password" required autocomplete="new-password"></div>
          <button class="btn btn-primary btn-sm" type="submit">Changer le mot de passe</button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/player-nav.js"></script>
  <script src="assets/js/perf-metrics.js"></script>
  <script src="assets/js/push.js"></script>
  <script src="assets/js/player-home.js"></script>
</body>
</html>
